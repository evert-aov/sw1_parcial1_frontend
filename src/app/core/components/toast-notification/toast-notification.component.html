<div class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2.5 items-end">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-start gap-3 px-4 py-3 rounded-xl border-2 shadow-2xl text-xs max-w-sm w-full min-w-[280px] animate-in slide-in-from-right fade-in duration-300"
      [ngClass]="getTypeClasses(toast.type)"
      role="alert"
      aria-live="assertive"
    >
      <!-- Icon -->
      <ng-icon
        [name]="getIcon(toast.type)"
        class="shrink-0 mt-0.5 text-base"
        [ngClass]="getIconColorClass(toast.type)"
        size="16"
      />

      <!-- Message -->
      <span class="flex-1 leading-relaxed font-semibold">{{ toast.message }}</span>

      <!-- Close button -->
      <button
        type="button"
        class="shrink-0 ml-1 opacity-70 hover:opacity-100 transition-opacity cursor-pointer"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Close notification"
      >
        <ng-icon name="heroXMark" size="14" />
      </button>
    </div>
  }
</div>
