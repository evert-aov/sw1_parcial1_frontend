<div
  class="bg-slate-100 dark:bg-[#0A0D1B] border-b border-slate-200 dark:border-slate-800 px-2 flex items-center justify-between z-10 shrink-0 select-none min-h-9.5"
>
  <!-- Contenedor scrollable de pestañas -->
  <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 flex-1 mr-2">
    @for (tab of tabs; track tab.id) {
      <div
        (click)="onSelectTab(tab.id)"
        [class.bg-white]="activeDiagramId === tab.id"
        [class.dark:bg-[#14182E]]="activeDiagramId === tab.id"
        [class.text-blue-600]="activeDiagramId === tab.id"
        [class.dark:text-blue-400]="activeDiagramId === tab.id"
        [class.shadow-xs]="activeDiagramId === tab.id"
        [class.font-semibold]="activeDiagramId === tab.id"
        [class.border-b-2]="true"
        [class.border-blue-500]="activeDiagramId === tab.id"
        [class.border-transparent]="activeDiagramId !== tab.id"
        [class.text-slate-500]="activeDiagramId !== tab.id"
        [class.dark:text-slate-400]="activeDiagramId !== tab.id"
        [class.hover:bg-slate-200/70]="activeDiagramId !== tab.id"
        [class.dark:hover:bg-[#151A33]]="activeDiagramId !== tab.id"
        [class.hover:text-slate-800]="activeDiagramId !== tab.id"
        [class.dark:hover:text-slate-200]="activeDiagramId !== tab.id"
        class="group flex items-center gap-2 px-3 py-1.5 rounded-t-md text-xs cursor-pointer transition-all max-w-55 shrink-0 border-t border-x border-slate-200/60 dark:border-slate-700/60"
      >
        <!-- Badge de tipo UML -->
        <span
          class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-200/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300 shrink-0"
        >
          {{ getTabTypeShort(tab.type) }}
        </span>

        <!-- Nombre del diagrama + indicador de cambios -->
        <span class="truncate" [title]="tab.name">
          @if (activeDiagramId === tab.id && hasUnsavedChanges) {
            <span class="text-amber-500 font-bold mr-0.5">●</span>
          }
          {{ tab.name }}
        </span>

        <!-- Botón cerrar tab (solo si hay más de 1 pestaña abierta) -->
        @if (tabs.length > 1) {
          <button
            type="button"
            (click)="onCloseTab(tab.id, $event)"
            title="Cerrar pestaña"
            class="opacity-0 group-hover:opacity-100 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 rounded p-0.5 transition-opacity shrink-0 cursor-pointer"
          >
            <ng-icon name="heroXMark" class="text-xs"></ng-icon>
          </button>
        }
      </div>
    }

    <!-- Botón + para Crear Nuevo Diagrama -->
    <button
      type="button"
      (click)="onCreateTab()"
      title="Crear nuevo diagrama en nueva pestaña"
      class="w-7 h-7 rounded hover:bg-white dark:hover:bg-[#14182E] text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 flex items-center justify-center cursor-pointer transition-colors shadow-2xs border border-transparent hover:border-slate-200 dark:hover:border-slate-700 shrink-0"
    >
      <ng-icon name="heroPlus" class="text-sm"></ng-icon>
    </button>
  </div>

  <!-- Breadcrumbs / Controles del lado derecho -->
  <div class="hidden sm:flex items-center gap-2 text-xs text-slate-400 font-mono shrink-0 pl-2">
    <span>/</span>
    <span class="font-medium text-slate-600 dark:text-slate-300">{{ currentDiagramName }}</span>
    <button
      (click)="onFitView()"
      title="Ajustar vista"
      class="ml-1 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 cursor-pointer transition-colors"
    >
      <ng-icon name="heroArrowsPointingOut" class="text-xs"></ng-icon>
    </button>
  </div>
</div>
