<!-- NODO DE DESPLIEGUE 3D (CUBO / PRISMA OBLICUO UML) -->
<div
  (click)="onContainerClick($event)"
  class="w-full h-full relative select-none cursor-pointer">

  <!-- Caras 3D Superior y Lateral Derecha mediante Componente SVG Reutilizable -->
  <app-deployment-node-svg
    mode="3d-faces"
    class="absolute inset-0 overflow-visible cursor-pointer"
    [nodeWidth]="nodeWidth"
    [nodeHeight]="nodeHeight"
    [topColor]="colors.top"
    [rightColor]="colors.right"
    [strokeColor]="colors.border"
    [strokeWidth]="1.5"
  />

  <!-- Cara Frontal Principal -->
  <div
    class="flex flex-col relative z-10"
    [ngClass]="{
      'ring-2 ring-blue-600 shadow-[0_0_12px_rgba(37,99,235,0.4)]': isSelected
    }"
    [style.width.px]="frontWidth"
    [style.height.px]="frontHeight"
    [style.marginTop.px]="14"
    [style.backgroundColor]="colors.front"
    [style.borderColor]="colors.border"
    style="border-width: 1.5px; border-style: solid;">

    <!-- Botón Eliminar en hover -->
    <button
      (click)="onDelete($event)"
      [disabled]="isLocked"
      [title]="'editor.canvas.nodes.deleteNode' | translate"
      class="absolute top-1 right-1 opacity-0 group-hover/node:opacity-100 hover:text-red-600 text-slate-500 p-0.5 cursor-pointer transition-opacity z-20 disabled:opacity-0">
      <ng-icon name="heroTrash" class="text-xs"></ng-icon>
    </button>

    <!-- Cabecera del Nodo: Estereotipo + Nombre -->
    <div
      class="px-2.5 py-1.5 flex flex-col items-center justify-center text-center border-b transition-colors cursor-pointer"
      [style.borderColor]="colors.border">
      @if (isRenaming) {
        <input
          #renameDeploymentInput
          appAutofocusInput
          type="text"
          [attr.data-rename-node-id]="node.id"
          [value]="node.name"
          (keydown.enter)="onCommit(renameDeploymentInput.value)"
          (keydown.escape)="onCancel()"
          (blur)="onCommit(renameDeploymentInput.value)"
          (keydown)="$event.stopPropagation()"
          (pointerdown)="$event.stopPropagation()"
          (mousedown)="$event.stopPropagation()"
          (click)="$event.stopPropagation()"
          class="uml-rename-input w-full text-center font-bold text-[12px] font-sans tracking-tight text-[#241C18] bg-white border border-blue-500 rounded px-1 py-0.5 outline-hidden ring-1 ring-blue-500 shadow-xs"
        />
      } @else {
        <span class="text-[9.5px] font-normal font-sans leading-tight text-[#241C18] select-none block">
          «{{ node.stereotype || node.nodeType || 'node' }}»
        </span>
        <span class="font-bold text-[12px] font-sans leading-snug text-[#241C18] block text-center truncate max-w-full" [title]="node.name">
          {{ node.name }}
        </span>
      }
    </div>

    <!-- Cuerpo del Nodo (Espacio de Contenido / Componentes) -->
    <div class="flex-1 p-2 flex flex-col justify-start overflow-hidden">
      @if (node.attributes && node.attributes.length > 0) {
        @for (attr of node.attributes; track attr.name) {
          <div class="text-[11px] font-sans text-[#241C18] truncate">
            {{ attr.name }}
          </div>
        }
      }
    </div>
  </div>
</div>
