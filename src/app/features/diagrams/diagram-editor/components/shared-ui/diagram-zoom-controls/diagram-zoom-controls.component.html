@if (variant === 'grid') {
  <!-- Modo Grid de 4 columnas para barra lateral / propiedades -->
  <div class="grid grid-cols-4 gap-1.5 pt-0.5">
    <button
      type="button"
      (click)="zoomOut.emit()"
      [title]="'toolbar.canvas.zoomOut' | translate"
      class="p-1.5 bg-slate-50 hover:bg-slate-100 dark:bg-[#14182E] dark:hover:bg-[#1B213D] border border-slate-200 dark:border-slate-700 rounded-md text-slate-600 dark:text-slate-300 flex items-center justify-center cursor-pointer transition-colors shadow-2xs hover:border-slate-300 dark:hover:border-slate-600"
    >
      <ng-icon name="heroMagnifyingGlassMinus" class="text-xs"></ng-icon>
    </button>
    <button
      type="button"
      (click)="zoomIn.emit()"
      [title]="'toolbar.canvas.zoomIn' | translate"
      class="p-1.5 bg-slate-50 hover:bg-slate-100 dark:bg-[#14182E] dark:hover:bg-[#1B213D] border border-slate-200 dark:border-slate-700 rounded-md text-slate-600 dark:text-slate-300 flex items-center justify-center cursor-pointer transition-colors shadow-2xs hover:border-slate-300 dark:hover:border-slate-600"
    >
      <ng-icon name="heroMagnifyingGlassPlus" class="text-xs"></ng-icon>
    </button>
    <button
      type="button"
      (click)="resetView.emit()"
      [title]="'toolbar.canvas.oneToOne' | translate"
      class="p-1.5 bg-slate-50 hover:bg-slate-100 dark:bg-[#14182E] dark:hover:bg-[#1B213D] border border-slate-200 dark:border-slate-700 rounded-md text-slate-700 dark:text-slate-200 font-mono text-[10.5px] font-semibold flex items-center justify-center cursor-pointer transition-colors shadow-2xs hover:border-slate-300 dark:hover:border-slate-600"
    >
      1:1
    </button>
    <button
      type="button"
      (click)="fitView.emit()"
      [title]="'toolbar.canvas.fitView' | translate"
      class="p-1.5 bg-slate-50 hover:bg-slate-100 dark:bg-[#14182E] dark:hover:bg-[#1B213D] border border-slate-200 dark:border-slate-700 rounded-md text-slate-600 dark:text-slate-300 flex items-center justify-center cursor-pointer transition-colors shadow-2xs hover:border-slate-300 dark:hover:border-slate-600"
    >
      <ng-icon name="heroArrowsPointingOut" class="text-xs"></ng-icon>
    </button>
  </div>
} @else {
  <!-- Modo Flex horizontal para Toolbox / barras flotantes -->
  <div class="flex items-center justify-between gap-1 w-full">
    <button
      type="button"
      (click)="zoomIn.emit()"
      [title]="'toolbar.canvas.zoomIn' | translate"
      class="p-1 bg-white dark:bg-[#151A30] hover:bg-slate-200 dark:hover:bg-[#20274A] border border-slate-300 dark:border-[#2D3762] text-slate-700 dark:text-slate-200 rounded flex-1 flex items-center justify-center cursor-pointer transition-colors shadow-2xs"
    >
      <ng-icon name="heroMagnifyingGlassPlus" class="text-xs"></ng-icon>
    </button>
    <button
      type="button"
      (click)="zoomOut.emit()"
      [title]="'toolbar.canvas.zoomOut' | translate"
      class="p-1 bg-white dark:bg-[#151A30] hover:bg-slate-200 dark:hover:bg-[#20274A] border border-slate-300 dark:border-[#2D3762] text-slate-700 dark:text-slate-200 rounded flex-1 flex items-center justify-center cursor-pointer transition-colors shadow-2xs"
    >
      <ng-icon name="heroMagnifyingGlassMinus" class="text-xs"></ng-icon>
    </button>
    <button
      type="button"
      (click)="resetView.emit()"
      [title]="'toolbar.canvas.oneToOne' | translate"
      class="p-1 bg-white dark:bg-[#151A30] hover:bg-slate-200 dark:hover:bg-[#20274A] border border-slate-300 dark:border-[#2D3762] text-slate-700 dark:text-slate-200 rounded flex-1 text-[10px] font-mono leading-none cursor-pointer transition-colors shadow-2xs"
    >
      1:1
    </button>
    <button
      type="button"
      (click)="fitView.emit()"
      [title]="'toolbar.canvas.fitView' | translate"
      class="p-1 bg-white dark:bg-[#151A30] hover:bg-slate-200 dark:hover:bg-[#20274A] border border-slate-300 dark:border-[#2D3762] text-slate-700 dark:text-slate-200 rounded flex-1 flex items-center justify-center cursor-pointer transition-colors shadow-2xs"
    >
      <ng-icon name="heroArrowsPointingOut" class="text-xs"></ng-icon>
    </button>
  </div>
}
