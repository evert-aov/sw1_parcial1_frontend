<button
  type="button"
  (click)="onClick()"
  [ngClass]="isSelected ? selectedClasses : 'hover:bg-slate-50 dark:hover:bg-[#151A32] text-slate-800 dark:text-slate-200 border-transparent'"
  class="w-full text-left px-2.5 py-2 rounded-lg flex items-center gap-2.5 border transition-all cursor-pointer group select-none"
>
  <div
    class="w-9 h-7 flex items-center justify-center bg-slate-50 dark:bg-[#161B34] border border-slate-200/80 dark:border-slate-700/60 rounded-md shrink-0 text-slate-700 dark:text-slate-300 group-hover:border-slate-300 dark:group-hover:border-slate-600 transition-colors p-0.5"
  >
    <svg
      viewBox="0 0 46 16"
      width="28"
      height="14"
      fill="none"
      class="w-full h-full"
      preserveAspectRatio="xMidYMid meet"
      xmlns="http://www.w3.org/2000/svg">
      @if (effectiveId === 'composition') {
        <polygon points="1,8 6,4 11,8 6,12" fill="currentColor" stroke="currentColor" stroke-width="1.2" />
        <line x1="11" y1="8" x2="44" y2="8" stroke="currentColor" stroke-width="1.5" />
      } @else if (effectiveId === 'aggregation') {
        <polygon points="1,8 6,4 11,8 6,12" fill="#FFFFFF" stroke="currentColor" stroke-width="1.2" />
        <line x1="11" y1="8" x2="44" y2="8" stroke="currentColor" stroke-width="1.5" />
      } @else if (effectiveId === 'generalization') {
        <line x1="2" y1="8" x2="36" y2="8" stroke="currentColor" stroke-width="1.5" />
        <polygon points="36,4 44,8 36,12" fill="#FFFFFF" stroke="currentColor" stroke-width="1.2" />
      } @else if (effectiveId === 'realization') {
        <line x1="2" y1="8" x2="36" y2="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,2" />
        <polygon points="36,4 44,8 36,12" fill="#FFFFFF" stroke="currentColor" stroke-width="1.2" />
      } @else if ($any(effectiveId) === 'direct_association') {
        <line x1="2" y1="8" x2="42" y2="8" stroke="currentColor" stroke-width="1.5" />
        <polyline points="37,4 43,8 37,12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      } @else if (effectiveId === 'dependency' || effectiveId === 'include' || effectiveId === 'extend' || effectiveId === 'import' || effectiveId === 'access' || effectiveId === 'merge' || effectiveId === 'trace') {
        <line x1="2" y1="8" x2="42" y2="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,2" />
        <polyline points="37,4 43,8 37,12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      } @else if (effectiveId === 'sync') {
        <line x1="2" y1="8" x2="36" y2="8" stroke="currentColor" stroke-width="1.5" />
        <polygon points="36,4 44,8 36,12" fill="currentColor" stroke="currentColor" stroke-width="1" />
      } @else if (effectiveId === 'reply') {
        <line x1="2" y1="8" x2="42" y2="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,2" />
        <polyline points="37,4 43,8 37,12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      } @else if (effectiveId === 'async' || effectiveId === 'create') {
        <line x1="2" y1="8" x2="42" y2="8" stroke="currentColor" stroke-width="1.5" />
        <polyline points="37,4 43,8 37,12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      } @else if (effectiveId === 'self') {
        <path d="M 28 8 C 28 2, 42 2, 42 8 C 42 14, 34 14, 34 10" fill="none" stroke="currentColor" stroke-width="1.2" />
        <polygon points="32,10 36,7 36,13" fill="currentColor" />
      } @else {
        <line x1="2" y1="8" x2="44" y2="8" stroke="currentColor" stroke-width="1.5" />
      }
    </svg>
  </div>
  <div class="min-w-0 flex-1">
    <div
      class="text-[11.5px] leading-tight font-medium text-slate-800 dark:text-slate-100"
    >
      {{ displayLabel }}
    </div>
    <div
      class="text-[9.5px] text-slate-400 dark:text-slate-400 truncate mt-0.5"
      [title]="displayDescription"
    >
      {{ displayDescription }}
    </div>
  </div>
</button>
