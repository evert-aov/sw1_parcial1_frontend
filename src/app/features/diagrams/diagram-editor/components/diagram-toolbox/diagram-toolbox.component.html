@if (isOpen()) {
  <aside
    class="w-56 bg-[#EAEAEA] dark:bg-[#121629] border-r border-[#B8B8B8] dark:border-[#283256] flex flex-col shrink-0 select-none text-xs text-slate-800 dark:text-slate-200 shadow-sm overflow-y-auto z-20 animate-in slide-in-from-left duration-150 transition-colors"
  >
    <!-- Cabecera del Toolbox con botón de colapso -->
    <div
      class="px-2.5 py-1.5 bg-[#DFDFDF] dark:bg-[#181D35] border-b border-[#C0C0C0] dark:border-[#283256] flex items-center justify-between font-mono font-bold text-[10.5px] text-slate-700 dark:text-slate-300"
    >
      <div class="flex items-center gap-1.5">
        <ng-icon name="heroBars3" class="text-xs text-slate-600 dark:text-slate-400"></ng-icon>
        <span>{{ 'toolbar.title' | translate }}</span>
      </div>
      <button
        (click)="closeToolbox.emit()"
        [title]="'toolbar.hideToolbox' | translate"
        class="text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-300 dark:hover:bg-[#252E56] rounded px-1.5 py-0.5 cursor-pointer text-xs flex items-center gap-0.5 transition-colors"
      >
        <ng-icon name="heroChevronLeft" class="text-xs"></ng-icon>
      </button>
    </div>

    <!-- Panel 1: Class Relationships -->
    <div class="border-b border-[#C8C8C8] dark:border-[#283256]">
      <app-diagram-tool-section-header
        [title]="'toolbar.relationships.title' | translate"
        [isOpen]="isRelationshipsOpen()"
        [actionText]="selectedRelationType() ? ('toolbar.relationships.deselect' | translate) : ''"
        [actionTitle]="'toolbar.relationships.deselect' | translate"
        (toggle)="isRelationshipsOpen.set(!isRelationshipsOpen())"
        (actionClick)="onSelectPointer()"
      />

      @if (isRelationshipsOpen()) {
        <div class="p-1.5 space-y-1 bg-[#F5F5F5] dark:bg-[#0E1222]">
          <!-- Herramienta Puntero / Mover -->
          <button
            type="button"
            (click)="onSelectPointer()"
            [ngClass]="{
              'bg-white dark:bg-[#151A30] border-slate-400 dark:border-[#2D3762] font-semibold shadow-xs text-slate-900 dark:text-slate-100':
                selectedRelationType() === null,
              'hover:bg-[#E8EEF5] dark:hover:bg-[#1C2242] text-slate-600 dark:text-slate-400 border-transparent':
                selectedRelationType() !== null,
            }"
            class="w-full text-left px-2 py-1.5 rounded flex items-center gap-2 border transition-colors mb-1 cursor-pointer"
          >
            <ng-icon
              name="heroCursorArrowRays"
              class="text-sm text-slate-700 dark:text-slate-300 shrink-0"
            ></ng-icon>
            <div>
              <div class="text-xs font-medium text-slate-800 dark:text-slate-200">
                {{ 'toolbar.pointer' | translate }}
              </div>
              <div class="text-[9.5px] text-slate-500 dark:text-slate-400">
                {{ 'toolbar.pointerDesc' | translate }}
              </div>
            </div>
          </button>

          <div class="border-t border-slate-200 dark:border-[#283256] my-1"></div>

          <!-- Lista de relaciones UML 2.5 -->
          @for (rel of relationTypes(); track rel.id) {
            <app-diagram-relationship-button
              [relationshipId]="rel.id"
              [label]="rel.label"
              [description]="rel.description"
              [isSelected]="selectedRelationType() === rel.id"
              (selectRelation)="onSelectRelation($event)"
            />
          }
        </div>
      }
    </div>

    <!-- Panel 2: Line Style (Routing) -->
    <div class="border-b border-[#C8C8C8] dark:border-[#283256]">
      <app-diagram-tool-section-header
        [title]="'toolbar.lineStylesTitle' | translate"
        [isOpen]="isLineStylesOpen()"
        (toggle)="isLineStylesOpen.set(!isLineStylesOpen())"
      />

      @if (isLineStylesOpen()) {
        <div class="p-1.5 space-y-1 bg-[#F5F5F5] dark:bg-[#0E1222]">
          @for (style of lineStyles(); track style.id) {
            <button
              type="button"
              (click)="onSetLineStyle(style.id)"
              [ngClass]="{
                'bg-white dark:bg-[#151A30] border-slate-400 dark:border-[#2D3762] font-semibold shadow-xs text-slate-900 dark:text-slate-100':
                  defaultLineStyle() === style.id,
                'hover:bg-[#E8EEF5] dark:hover:bg-[#1C2242] text-slate-600 dark:text-slate-400 border-transparent':
                  defaultLineStyle() !== style.id,
              }"
              class="w-full text-left px-2 py-1 rounded flex items-center justify-between border transition-all cursor-pointer"
            >
              <span class="text-xs">{{ style.label }}</span>
              @if (defaultLineStyle() === style.id) {
                <ng-icon
                  name="heroCheck"
                  class="text-xs text-blue-600 dark:text-indigo-400 font-bold"
                ></ng-icon>
              }
            </button>
          }
        </div>
      }
    </div>

    <!-- Panel 3: Zoom y Vistas Rápidas -->
    <div class="p-2 border-b border-[#C8C8C8] dark:border-[#283256] bg-[#F5F5F5] dark:bg-[#0E1222]">
      <app-diagram-zoom-controls
        variant="flex"
        (zoomIn)="zoomIn.emit()"
        (zoomOut)="zoomOut.emit()"
        (resetView)="resetView.emit()"
        (fitView)="fitView.emit()"
      />
    </div>

    <!-- Botón Agregar Nueva Clase UML -->
    <div
      class="p-3 mt-auto bg-slate-50 dark:bg-[#0D1124] border-t border-slate-200/80 dark:border-slate-800"
    >
      <button
        (click)="addClass.emit()"
        [disabled]="isReadOnly()"
        [title]="
          isReadOnly()
            ? ('toolbar.readOnlyMode' | translate)
            : ('toolbar.addClassTooltip' | translate)
        "
        class="w-full py-2 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white text-xs font-semibold rounded-xl shadow-xs transition-all cursor-pointer flex items-center justify-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        <ng-icon name="heroPlus" class="text-xs"></ng-icon>
        <span>{{ 'toolbar.newClassBtn' | translate }}</span>
      </button>
    </div>
  </aside>
}
