@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in fade-in duration-150">
    <div class="bg-white dark:bg-[#111528] rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 w-full max-w-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-150 transition-colors">

      <!-- Header -->
      <div class="px-6 py-4 bg-white dark:bg-[#111528] text-slate-800 dark:text-slate-100 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center">
            <ng-icon name="heroDocumentText" class="text-base"></ng-icon>
          </div>
          <h2 class="text-sm font-bold text-slate-800 dark:text-slate-100 tracking-tight">
            {{ mode() === 'export' ? ('editor.jsonModal.exportTitle' | translate) : ('editor.jsonModal.importTitle' | translate) }}
          </h2>
        </div>
        <button (click)="onClose()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg cursor-pointer leading-none">&times;</button>
      </div>

      <!-- Content -->
      <div class="p-6 flex-1 flex flex-col gap-3">
        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
          {{ mode() === 'export'
             ? ('editor.jsonModal.exportDesc' | translate)
             : ('editor.jsonModal.importDesc' | translate) }}
        </p>

        <textarea
          [(ngModel)]="jsonContent"
          rows="14"
          class="w-full bg-[#0D1117] text-emerald-400 font-mono text-xs p-3.5 rounded-xl border border-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 resize-none selection:bg-blue-600 selection:text-white"
          [placeholder]="'editor.jsonModal.placeholder' | translate"></textarea>
      </div>

      <!-- Footer -->
      <div class="px-6 py-3.5 bg-slate-50/60 dark:bg-[#0D1124] border-t border-slate-100 dark:border-slate-800 flex justify-end gap-2.5">
        <button
          (click)="onClose()"
          class="px-4 py-2 text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-[#1E2548] rounded-xl font-semibold transition-colors cursor-pointer">
          {{ 'common.close' | translate }}
        </button>

        @if (mode() === 'export') {
          <button
            (click)="copyToClipboard()"
            class="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold shadow-xs flex items-center gap-1.5 transition-all cursor-pointer">
            <ng-icon name="heroClipboardDocument" class="text-sm"></ng-icon>
            {{ 'editor.jsonModal.copy' | translate }}
          </button>
        } @else {
          <button
            (click)="onApply()"
            class="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold shadow-xs flex items-center gap-1.5 transition-all cursor-pointer">
            <ng-icon name="heroCheck" class="text-sm"></ng-icon>
            {{ 'editor.jsonModal.apply' | translate }}
          </button>
        }
      </div>

    </div>
  </div>
}
