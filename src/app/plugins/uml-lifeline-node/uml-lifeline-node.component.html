<!-- LÍNEA DE VIDA (LIFELINE) UML 2.5 - ENTERPRISE ARCHITECT STYLE -->
<div
  (click)="onContainerClick($event)"
  class="w-full h-full flex flex-col items-center justify-start relative select-none cursor-pointer"
>
  <!-- Botón Eliminar en hover -->
  <button
    (click)="onDelete($event)"
    [disabled]="isLocked()"
    [title]="'editor.canvas.nodes.deleteLifeline' | translate"
    class="absolute -top-2 -right-2 opacity-0 group-hover/node:opacity-100 hover:text-red-600 text-slate-400 p-0.5 cursor-pointer transition-opacity z-30 disabled:opacity-0 bg-white rounded-full shadow-xs border border-slate-200"
  >
    <ng-icon name="heroTrash" class="text-xs"></ng-icon>
  </button>

  <!-- CABECERA SUPERIOR (HEADER BOX - DISEÑO PLANO Y BORDE FINO) -->
  <div
    [ngClass]="{
      'ring-1.5 ring-cyan-600 shadow-none': isSelected(),
      'border-[#796354] shadow-none': !isSelected(),
    }"
    [style.backgroundColor]="node().color || '#DDF4F5'"
    class="w-full h-full min-h-11 border rounded-none px-2.5 py-1.5 flex items-center justify-center text-center relative z-20 transition-all shadow-none"
  >
    @if (isRenaming) {
      <input
        #renameLifelineInput
        appAutofocusInput
        type="text"
        [attr.data-rename-node-id]="node().id"
        [value]="node().name"
        (keydown.enter)="commitRename.emit(renameLifelineInput.value)"
        (keydown.escape)="cancelRename.emit()"
        (blur)="commitRename.emit(renameLifelineInput.value)"
        (keydown)="$event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
        (mousedown)="$event.stopPropagation()"
        (click)="$event.stopPropagation()"
        class="uml-rename-input w-full text-center font-bold text-xs font-sans tracking-tight text-[#241C18] bg-white border border-cyan-500 rounded px-1 py-0.5 outline-hidden ring-1 ring-cyan-500 shadow-xs"
      />
    } @else {
      <div class="flex flex-col items-center justify-center max-w-full">
        @if (node().name && node().name.trim()) {
          <span
            class="font-bold text-xs font-sans tracking-tight text-[#241C18] truncate underline underline-offset-2 decoration-[#796354]/60 max-w-full block"
            [title]="node().name"
          >
            {{ node().name }}
          </span>
        } @else {
          <span class="font-normal italic text-slate-400 text-[11px] truncate block select-none">
            (sin nombre)
          </span>
        }
      </div>
    }
  </div>

  <!-- LÍNEA DISCONTINUA VERTICAL (SOLO SUPERIOR, SIN CABECERA INFERIOR) -->
  <div
    class="uml-lifeline-vertical-line absolute top-full left-1/2 -translate-x-1/2 flex flex-col items-center z-10 w-0.5"
    [style.height.px]="lifelineLength()"
  >
    <!-- Línea discontinua central vertical SVG (nítida y continua desde el borde inferior) -->
    <svg
      class="uml-lifeline-svg overflow-visible"
      width="2"
      [attr.height]="lifelineLength()"
      [style.height.px]="lifelineLength()"
      style="display: block"
    >
      <line
        x1="1"
        y1="0"
        x2="1"
        [attr.y2]="lifelineLength()"
        stroke="#796354"
        stroke-width="1.5"
        stroke-dasharray="6,4"
        style="stroke: #796354; stroke-width: 1.5px; stroke-dasharray: 6px, 4px"
      />
    </svg>

    <!-- Focos de Activación (Activation Bars) -->
    @for (act of activations(); track act.id) {
      <div
        class="absolute left-1/2 -translate-x-1/2 w-3.5 border shadow-2xs pointer-events-none z-20 rounded-none"
        [style.top.px]="act.top"
        [style.height.px]="act.height"
        [style.backgroundColor]="node().color || '#DDF4F5'"
        style="border-color: #796354"
        [title]="'editor.canvas.nodes.focusActivation' | translate"
      ></div>
    }
  </div>

  <!-- SLOTS DE CONEXIÓN A LO LARGO DE LA LÍNEA DE VIDA (ZONA AMPLIA DE DESTINO) -->
  @for (slot of sequenceSlots; track slot) {
    <div
      fConnector
      fConnectorType="source-target"
      [fConnectorId]="node().id + '_slot_' + slot"
      [fConnectorSelfConnectable]="true"
      [fConnectorDisabled]="
        selectedRelationType() === null || isLocked() || isSequenceSlotOccupiedFn(slot)
      "
      (click)="onSlotClick($event)"
      [title]="
        isSequenceSlotOccupiedFn(slot)
          ? 'Fila ocupada por otro mensaje'
          : 'Punto de secuencia ' + (slot + 1)
      "
      [ngClass]="{
        'opacity-100 scale-100 pointer-events-auto':
          selectedRelationType() !== null && !isLocked() && !isSequenceSlotOccupiedFn(slot),
        'opacity-0 scale-75 pointer-events-none':
          selectedRelationType() === null || isSequenceSlotOccupiedFn(slot),
      }"
      [style.top.px]="getSlotTopFn(slot) - 18"
      class="uml-sequence-slot-zone group/slot absolute left-1/2 -translate-x-1/2 w-20 h-12.5 flex items-center justify-center z-30 cursor-crosshair"
    >
      <div
        class="uml-sequence-slot w-3.5 h-3.5 rounded-full bg-cyan-500 border-2 border-white shadow-xs transition-transform group-hover/slot:scale-125 group-hover/slot:bg-cyan-600 pointer-events-none"
      ></div>
    </div>
  }
</div>
