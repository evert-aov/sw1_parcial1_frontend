<!-- CASO DE USO (ELIPSE UML) -->
<div
  (click)="onContainerClick($event)"
  [ngClass]="{
    'ring-2 ring-blue-600 shadow-[0_0_12px_rgba(37,99,235,0.45)]': isSelected(),
    'shadow-[3px_3px_0px_rgba(0,0,0,0.15)]': !isSelected()
  }"
  [style.backgroundColor]="node().color || '#E5F2FE'"
  class="w-full h-full flex items-center justify-center p-3 relative rounded-[50%] border-2 border-[#796354] select-none cursor-pointer">
  
  <button
    (click)="onDelete($event)"
    [disabled]="isLocked()"
    [title]="'editor.canvas.nodes.deleteUseCase' | translate"
    class="absolute top-1 right-3 opacity-0 group-hover/node:opacity-100 hover:text-red-600 text-slate-400 p-0.5 cursor-pointer transition-opacity z-20 disabled:opacity-0">
    <ng-icon name="heroTrash" class="text-xs"></ng-icon>
  </button>

  <!-- Nombre del Caso de Uso Centrado -->
  <div class="text-center px-2 w-full flex items-center justify-center">
    @if (isRenaming) {
      <input
        #renameUcInput
        appAutofocusInput
        type="text"
        [attr.data-rename-node-id]="node().id"
        [value]="node().name"
        (keydown.enter)="onCommit(renameUcInput.value)"
        (keydown.escape)="onCancel()"
        (blur)="onCommit(renameUcInput.value)"
        (keydown)="$event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
        (mousedown)="$event.stopPropagation()"
        (click)="$event.stopPropagation()"
        class="uml-rename-input w-full text-center font-bold text-[11.5px] font-sans leading-tight text-[#241C18] bg-white border border-blue-500 rounded px-1 py-0.5 outline-hidden ring-1 ring-blue-500 shadow-xs"
      />
    } @else {
      <span class="font-bold text-[11.5px] font-sans leading-snug text-[#241C18] block text-center break-words select-none max-w-full px-1" [title]="node().name">
        {{ node().name }}
      </span>
    }
  </div>
</div>
