<!-- FRAGMENTO COMBINADO UML 2.5 (ESTILO ENTERPRISE ARCHITECT CON SOMBRA DERECHA/INFERIOR Y DIVISOR MÓVIL) -->
<div
  #fragmentFrame
  (click)="onContainerClick($event)"
  [ngClass]="{
    'border-blue-600 shadow-[3px_3px_0px_rgba(37,99,235,0.35)]': isSelected(),
    'border-[#796354] shadow-[3px_3px_0px_rgba(121,99,84,0.38)]': !isSelected(),
  }"
  [style.backgroundColor]="backgroundColor()"
  class="uml-combined-fragment w-full h-full border-[1.5px] rounded-none relative select-none cursor-move overflow-visible"
>
  <!-- Botón Eliminar en hover -->
  <button
    (click)="onDelete($event)"
    (pointerdown)="$event.stopPropagation()"
    (mousedown)="$event.stopPropagation()"
    [disabled]="isLocked()"
    [title]="'editor.canvas.nodes.deleteCombinedFragment' | translate"
    class="absolute top-1 right-1 opacity-0 group-hover/node:opacity-100 hover:text-red-600 text-slate-400 p-0.5 cursor-pointer transition-opacity z-40 disabled:opacity-0 bg-white/90 rounded-full shadow-2xs border border-slate-200"
  >
    <ng-icon name="heroTrash" class="text-xs"></ng-icon>
  </button>

  <!-- Pestaña Pentagonal UML 2.5 del Operador (esquina superior izquierda, degradado verde suave EA) -->
  <div class="absolute top-0 left-0 z-30 pointer-events-none flex items-start">
    <div
      class="relative min-w-[62px] h-[26px] pl-2.5 pr-4 flex items-center justify-start"
      style="
        background: linear-gradient(135deg, #F7FCF5 0%, #E3F2DF 100%);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%);
      "
    >
      <span class="font-bold text-[12px] font-sans tracking-tight text-[#334155] leading-none">
        {{ fragment().operator }}
      </span>
      <!-- Borde SVG nítido del pentágono (derecha + chaflán diagonal + base) -->
      <svg
        class="absolute inset-0 w-full h-full overflow-visible pointer-events-none"
        preserveAspectRatio="none"
        viewBox="0 0 100 26"
      >
        <polyline
          points="100,0 100,17 88,26 0,26"
          fill="none"
          [attr.stroke]="isSelected() ? '#2563EB' : '#796354'"
          stroke-width="1.5"
          vector-effect="non-scaling-stroke"
        />
      </svg>
    </div>
  </div>

  <!-- Compartimentos / Operandos posicionados según los divisores -->
  @for (guard of fragment().operands; track $index) {
    <div
      class="absolute left-0 right-0 pointer-events-none px-2.5 flex items-start"
      [style.top.%]="getOperandTopPct($index)"
      [style.height.%]="getOperandHeightPct($index)"
      [ngClass]="{
        'pt-[30px]': $index === 0,
        'pt-1.5': $index > 0,
      }"
    >
      @if (guard) {
        <span
          class="text-[12px] font-sans font-normal text-[#334155] bg-white/75 px-1 py-0.5 rounded-2xs leading-tight select-none"
        >
          {{ guard }}
        </span>
      }
    </div>
  }

  <!-- Líneas Divisorias Horizontales Discontinuas Arrastrables (---) -->
  @for (dividerPct of effectiveDividers(); track $index) {
    <div
      (pointerdown)="onDividerPointerDown($event, $index)"
      (mousedown)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
      [style.top.%]="dividerPct"
      [title]="'Arrastrar arriba o abajo para mover el separador'"
      class="uml-fragment-divider group/divider absolute left-0 right-0 h-3.5 -translate-y-1/2 z-30 flex items-center cursor-ns-resize pointer-events-auto"
    >
      <div
        class="w-full border-t-[1.5px] border-dashed transition-colors"
        [ngClass]="{
          'border-blue-600': activeDividerIndex() === $index,
          'border-[#796354] group-hover/divider:border-blue-500': activeDividerIndex() !== $index,
        }"
      ></div>
    </div>
  }
</div>
