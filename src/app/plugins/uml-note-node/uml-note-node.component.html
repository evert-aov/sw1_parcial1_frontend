<div
  (click)="onContainerClick($event)"
  [ngClass]="{
    'border-blue-600 shadow-[0_0_14px_rgba(37,99,235,0.35)]': isSelected(),
    'border-purple-500/80 shadow-[3px_4px_10px_rgba(147,51,234,0.18)]': !isSelected() && isPurpleNote(),
    'border-amber-500/80 shadow-[3px_4px_10px_rgba(120,53,15,0.16)]': !isSelected() && !isPurpleNote()
  }"
  [style.backgroundColor]="node().color || '#FEF9C3'"
  class="w-full h-full relative flex flex-col border-2 rounded-sm p-2.5 select-none cursor-pointer overflow-hidden"
>
  <!-- Esquina doblada superior derecha estilo Post-it / Comentario UML -->
  <svg
    width="18"
    height="18"
    viewBox="0 0 18 18"
    aria-hidden="true"
    class="absolute top-0 right-0 pointer-events-none opacity-80"
  >
    <polygon points="0,0 18,18 0,18" [attr.fill]="isPurpleNote() ? 'rgba(147,51,234,0.18)' : 'rgba(161,98,7,0.18)'" />
    <polyline points="0,0 0,18 18,18" fill="none" [attr.stroke]="isPurpleNote() ? 'rgba(147,51,234,0.55)' : 'rgba(161,98,7,0.55)'" stroke-width="1.2" />
  </svg>

  <!-- Cabecera sutil de nota colaborativa -->
  <div class="flex items-center justify-between gap-1.5 pr-4 pb-1 mb-1 border-b"
    [ngClass]="isPurpleNote() ? 'border-purple-700/20 text-purple-900/75' : 'border-amber-700/15 text-amber-900/75'">
    <span class="inline-flex items-center gap-1 text-[9.5px] font-semibold uppercase tracking-wide truncate">
      <ng-icon name="heroChatBubbleBottomCenterText" class="text-[11px]" />
      <span>{{ 'editor.canvas.nodes.noteBadge' | translate }}</span>
    </span>
    <button
      type="button"
      (click)="onDelete($event)"
      [disabled]="isLocked()"
      [title]="'editor.canvas.nodes.deleteNote' | translate"
      class="opacity-0 group-hover/node:opacity-100 hover:text-red-600 p-0.5 cursor-pointer transition-opacity z-20 disabled:opacity-0"
      [ngClass]="isPurpleNote() ? 'text-purple-900/60' : 'text-amber-900/60'"
    >
      <ng-icon name="heroTrash" class="text-xs"></ng-icon>
    </button>
  </div>

  <!-- Contenido editable o visualización multilínea -->
  <div class="flex-1 min-h-0 w-full flex flex-col justify-start overflow-hidden">
    @if (isRenaming) {
      <textarea
        #renameNoteArea
        autofocus
        rows="3"
        [attr.data-rename-node-id]="node().id"
        [value]="node().name"
        [placeholder]="'editor.canvas.nodes.notePlaceholder' | translate"
        (keydown)="onTextareaKeyDown($event, renameNoteArea.value)"
        (blur)="onCommit(renameNoteArea.value)"
        (pointerdown)="$event.stopPropagation()"
        (mousedown)="$event.stopPropagation()"
        (click)="$event.stopPropagation()"
        class="uml-rename-input flex-1 w-full resize-none text-[12px] font-sans leading-snug text-slate-900 bg-white/85 border border-blue-500 rounded-xs px-1.5 py-1 outline-hidden ring-1 ring-blue-500"
      ></textarea>
    } @else {
      <p
        class="text-[12px] font-sans leading-snug whitespace-pre-wrap break-words overflow-hidden"
        [ngClass]="isPurpleNote() ? 'text-purple-950 font-medium' : 'text-slate-800'"
        [title]="node().name"
      >{{ node().name || ('editor.canvas.nodes.notePlaceholder' | translate) }}</p>
    }
  </div>
</div>
