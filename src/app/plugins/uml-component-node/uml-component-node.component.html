<!-- COMPONENTE UML (RECTÁNGULO CON ICONO DE COMPONENTE EN ESQUINA SUPERIOR DERECHA - ESTÁNDAR UML 2.5) -->
<div
  (click)="onContainerClick($event)"
  [ngClass]="{
    'ring-2 ring-blue-600 shadow-[0_0_12px_rgba(37,99,235,0.4)]': isSelected(),
    'shadow-[3px_3px_0px_rgba(0,0,0,0.12)]': !isSelected()
  }"
  [style.backgroundColor]="bgColor"
  class="w-full h-full flex flex-col justify-center px-4 py-2 relative border-2 border-[#796354] select-none cursor-pointer rounded-none">

  <!-- Botón Eliminar en hover -->
  <button
    (click)="onDelete($event)"
    [disabled]="isLocked()"
    [title]="'editor.canvas.nodes.deleteComponent' | translate"
    class="absolute top-1 left-1 opacity-0 group-hover/node:opacity-100 hover:text-red-600 text-slate-500 p-0.5 cursor-pointer transition-opacity z-20 disabled:opacity-0">
    <ng-icon name="heroTrash" class="text-xs"></ng-icon>
  </button>

  <!-- Icono UML de Componente en la esquina superior derecha (Estándar UML 2.5) -->
  <div class="absolute top-2 right-2.5 pointer-events-none z-10">
    <app-component-svg
      mode="glyph"
      width="22"
      height="20"
      [fillColor]="bgColor"
      strokeColor="#796354"
      [strokeWidth]="1.5"
    />
  </div>

  <!-- Estereotipo en la parte superior centro y Nombre del Componente -->
  <div class="w-full h-full flex flex-col items-center justify-center text-center px-6 py-1.5 overflow-hidden">
    @if (node().stereotype) {
      <span class="text-[11.5px] font-serif italic text-slate-700 leading-tight select-none block mb-0.5 tracking-tight">
        «{{ node().stereotype }}»
      </span>
    }
    @if (isRenaming) {
      <input
        #renameCompInput
        appAutofocusInput
        type="text"
        [attr.data-rename-node-id]="node().id"
        [value]="node().name"
        (keydown.enter)="onCommit(renameCompInput.value)"
        (keydown.escape)="onCancel()"
        (blur)="onCommit(renameCompInput.value)"
        (keydown)="$event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
        (mousedown)="$event.stopPropagation()"
        (click)="$event.stopPropagation()"
        class="uml-rename-input w-full font-bold text-[12.5px] text-center font-sans leading-tight text-[#241C18] bg-white border border-blue-500 rounded px-1.5 py-0.5 outline-hidden ring-1 ring-blue-500 shadow-xs"
      />
    } @else {
      <span class="font-bold text-[13px] font-sans leading-tight text-[#241C18] select-none truncate max-w-full text-center" [title]="node().name">
        {{ node().name }}
      </span>
    }
  </div>
</div>
