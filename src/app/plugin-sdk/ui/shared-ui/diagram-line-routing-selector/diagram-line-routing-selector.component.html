<div class="space-y-1.5">
  <div class="flex items-center justify-between px-0.5">
    <span class="text-[10.5px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
      {{ 'editor.lineStylesTitle' | translate }}
    </span>
  </div>
  <div class="flex items-center gap-1.5">
    <select
      [value]="selectedStyle"
      (change)="onChange($event)"
      class="flex-1 min-w-0 px-2 py-1.5 text-[11px] bg-slate-50 dark:bg-[#14182E] border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-200 font-medium focus:ring-1 focus:ring-blue-500 focus:outline-hidden cursor-pointer truncate"
    >
      @for (style of lineStyles; track style.id) {
        <option [value]="style.id" [selected]="style.id === selectedStyle">
          {{ getLineStyleLabel(style.id, style.label) }}
        </option>
      }
    </select>
    <button
      type="button"
      (click)="onApplyToAll()"
      [title]="'editor.applyAllLinesTooltip' | translate"
      class="px-2 py-1.5 bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/60 dark:hover:bg-blue-900/60 text-blue-600 dark:text-blue-300 border border-blue-200/80 dark:border-blue-800/80 rounded-lg text-[10.5px] font-semibold flex items-center gap-1 transition-colors cursor-pointer shrink-0 shadow-2xs"
    >
      <ng-icon name="heroArrowPath" class="text-xs"></ng-icon>
      <span>{{ 'editor.applyAllLines' | translate }}</span>
    </button>
  </div>
</div>
