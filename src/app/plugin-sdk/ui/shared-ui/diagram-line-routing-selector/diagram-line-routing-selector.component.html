<select
  [value]="selectedStyle"
  (change)="onChange($event)"
  class="w-full px-2.5 py-1.5 text-[11px] bg-slate-50 dark:bg-[#14182E] border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-200 font-medium focus:ring-1 focus:ring-blue-500 focus:outline-hidden cursor-pointer"
>
  @for (style of lineStyles; track style.id) {
    <option [value]="style.id">
      {{ getLineStyleLabel(style.id, style.label) }}
    </option>
  }
</select>
