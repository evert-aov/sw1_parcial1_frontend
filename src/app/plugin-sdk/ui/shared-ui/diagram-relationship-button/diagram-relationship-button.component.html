<button
  type="button"
  (click)="onClick()"
  [ngClass]="isSelected ? selectedClasses : 'hover:bg-slate-50 dark:hover:bg-[#151A32] text-slate-800 dark:text-slate-200 border-transparent'"
  class="w-full text-left px-2.5 py-2 rounded-lg flex items-center gap-2.5 border transition-all cursor-pointer group select-none"
>
  <div
    class="w-9 h-7 flex items-center justify-center bg-slate-50 dark:bg-[#161B34] border border-slate-200/80 dark:border-slate-700/60 rounded-md shrink-0 text-slate-700 dark:text-slate-300 group-hover:border-slate-300 dark:group-hover:border-slate-600 transition-colors p-0.5"
  >
    <app-relationship-svg
      [type]="$any(effectiveId)"
      mode="icon"
      width="28"
      height="14"
      strokeColor="currentColor"
    />
  </div>
  <div class="min-w-0 flex-1">
    <div
      class="text-[11.5px] leading-tight font-medium text-slate-800 dark:text-slate-100"
    >
      {{ displayLabel }}
    </div>
    <div
      class="text-[9.5px] text-slate-400 dark:text-slate-400 truncate mt-0.5"
      [title]="displayDescription"
    >
      {{ displayDescription }}
    </div>
  </div>
</button>
