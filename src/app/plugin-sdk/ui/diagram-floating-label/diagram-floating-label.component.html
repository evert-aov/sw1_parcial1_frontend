<div
  class="uml-floating-label absolute left-1/2 -translate-x-1/2 top-full mt-1.5 select-none z-30 flex flex-col items-center group/label pointer-events-auto"
  (dblclick)="onDblClick($event)"
  [title]="'editor.canvas.nodes.doubleClickToEdit' | translate"
>
  @if (isRenaming) {
    <input
      #renameInput
      appAutofocusInput
      type="text"
      [attr.data-rename-node-id]="node.id"
      [value]="node.name"
      (keydown.enter)="onCommit(renameInput.value)"
      (keydown.escape)="onCancel()"
      (blur)="onCommit(renameInput.value)"
      (keydown)="$event.stopPropagation()"
      (pointerdown)="$event.stopPropagation()"
      (mousedown)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
      class="uml-rename-input text-center font-semibold text-[11.5px] font-sans tracking-tight text-[#241C18] bg-white border rounded px-1.5 py-0.5 outline-hidden shadow-sm min-w-20 max-w-55"
      [ngClass]="{
        'border-blue-500 ring-1 ring-blue-500': accentColor === 'blue',
        'border-cyan-500 ring-1 ring-cyan-500': accentColor === 'cyan',
        'border-teal-500 ring-1 ring-teal-500': accentColor === 'teal',
        'border-emerald-500 ring-1 ring-emerald-500': accentColor === 'emerald',
        'border-amber-500 ring-1 ring-amber-500': accentColor === 'amber',
      }"
    />
  } @else {
    <div
      class="flex items-center gap-1 px-2 py-0.5 rounded-md transition-all border border-slate-200/80 bg-white/95 shadow-2xs hover:bg-slate-50 hover:border-slate-300"
    >
      <span
        class="font-semibold text-[11.5px] font-sans tracking-tight text-[#241C18] whitespace-nowrap select-none max-w-60 truncate"
        [title]="node.name"
      >
        {{ node.name || fallbackName }}
      </span>
    </div>
  }
</div>
